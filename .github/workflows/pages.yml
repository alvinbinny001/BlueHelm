name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site for the project path
        run: |
          mkdir _site
          cp -R frontend/. _site/
          node <<'NODE'
          const fs = require("node:fs");
          const basePath = `/${process.env.GITHUB_REPOSITORY.split("/")[1]}`;
          const replacements = [
            ["assets/index-CyzSREEe.js", 'parser:o$,base:""', `parser:o$,base:"${basePath}"`],
            ["assets/split-flap-hero.js", "link.href = '/assets/SplitFlapText.css';", "link.href = './assets/SplitFlapText.css';"],
            ["assets/neuronex-branding.js", 'const iconPath = "/assets/freightflow-icon.png";', 'const iconPath = "./assets/freightflow-icon.png";'],
          ];

          for (const [file, from, to] of replacements) {
            const path = `_site/${file}`;
            const content = fs.readFileSync(path, "utf8");
            const occurrences = content.split(from).length - 1;
            if (occurrences !== 1) {
              throw new Error(`Expected one path to replace in ${file}, found ${occurrences}`);
            }
            fs.writeFileSync(path, content.replace(from, to));
          }
          NODE
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4